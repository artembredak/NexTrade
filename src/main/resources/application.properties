spring.application.name=NexTrade

# Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/nextrade}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# JWT
nextrade.jwt.secret=${JWT_SECRET}
nextrade.jwt.access-expiration-ms=900000
nextrade.jwt.refresh-expiration-ms=604800000

# CoinGecko API
coingecko.api.base-url=https://api.coingecko.com/api/v3
coingecko.api.coins=bitcoin,ethereum,solana,binancecoin,cardano,polkadot,avalanche-2

# Scheduler
scheduler.price-update-interval-ms=30000
scheduler.snapshot-interval-ms=1800000

# Server
server.port=8080

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html